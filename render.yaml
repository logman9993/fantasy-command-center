services:
  - type: web
    name: fantasy-command-center
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 90 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NFL_SEASON
        value: "2026"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FANTASYPROS_API_KEY
        sync: false
