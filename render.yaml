services:
  - type: web
    name: fantasy-command-center
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FANTASYPROS_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fantasy-command-center-cache
          property: connectionString
      - key: ESPN_EXTENSION_ID
        value: "ghcidgjabdbhbkjjchbnaoccpiihkjjj"

  - type: keyvalue
    name: fantasy-command-center-cache
    plan: free
    ipAllowList: []
